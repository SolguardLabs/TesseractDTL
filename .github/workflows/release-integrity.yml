name: release-integrity

on:
  push:
    branches: [production]
    tags: ["v*"]
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify immutable release pointer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main production --tags
          main=$(git rev-parse origin/main)
          production=$(git rev-parse origin/production)
          tag=$(git rev-parse 'v1.0.0^{}')
          test "$main" = "$production"
          test "$main" = "$tag"
          test "$(node -p 'require("./package.json").version')" = '1.0.0'
